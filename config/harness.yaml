# InfoSails Agentic Harness — kit
# Fuente de verdad del lifecycle. La memoria de producto NO vive aquí.

name: infosails-harness
kind: kit
version: 0.14.0
license: Apache-2.0
homepage: https://github.com/infosails/infosails-harness
description: Kit instalable para desarrollo basado en agentes

model:
  kit: |
    Este repositorio. Se instala una vez en la máquina.
  project: |
    Repo instanciado con infosails-init; contiene código + memory/.
  memory: |
    blueprints, bugs, designs, architecture (landscape+ADRs),
    director-state, processes/<proceso>/, lessons/.
  hierarchy: |
    Usuario ↔ Orquesta ↔ Lead ↔ agentes internos (grafo de ejecución; frontier en paralelo).
    Ver .cursor/skills/_shared/lead-subagents.md y graph.md

install:
  script: scripts/install
  init_project: scripts/init-project
  update_project: scripts/update-project
  command: infosails-init
  update_command: infosails-update
  project_template: templates/project
  pack:
    script: scripts/pack
    manifest: config/pack.manifest
    output: dist/infosails-harness-{version}
    excludes: [playground, scripts/playground, phases, .cursor]
    note: |
      Runtime para partir proyectos. El playground solo existe en el repo
      de desarrollo del kit; no va en el pack ni hace falta para infosails-init.
      Skills del pack: skills/ (init también lee .cursor/skills del repo kit).

orchestrator:
  agent: director
  skill: .cursor/skills/director/SKILL.md
  state_file: memory/director-state.json
  state_schema: schemas/director-state.schema.json
  owns_state: true
  speaks_to: leads_only
  protocol: .cursor/skills/director/protocol.md
  costs: .cursor/skills/director/costs.md
  first_action: read_state_then_menu_or_resume
  playground:
    path: playground
    marker: playground/harness.project.yaml
    setup: scripts/playground
  pipeline:
    blueprint: [discovery, design, build, deploy]
    bug: [bug, build, deploy]
  transitions:
    discovery_done: design
    design_done: build
    bug_done: build
    build_done: deploy
    onboard_done: null
    deploy_done: null
  intents:
    discovery:
      process: discovery
      lead: discovery-lead
      skill: .cursor/skills/discovery/SKILL.md
      aliases: [discovery, blueprint, historia, requisitos, alcance]
    feature:
      process: discovery
      lead: discovery-lead
      skill: .cursor/skills/discovery/SKILL.md
      aliases: [feature, nueva feature, nueva funcionalidad]
    bug:
      process: bug
      lead: bug-lead
      skill: .cursor/skills/bug/SKILL.md
      aliases: [bug, defect, error, fix]
    design:
      process: design
      lead: design-lead
      skill: .cursor/skills/design/SKILL.md
      status: active
      aliases: [design, arquitectura, diseñar, design package]
      activated_by: orchestra-director
    build:
      process: build
      lead: build-lead
      skill: .cursor/skills/build/SKILL.md
      status: active
      aliases: [build, implementar, tdd, coding]
      activated_by: orchestra-director
    onboard:
      process: onboard
      lead: onboard-lead
      skill: .cursor/skills/onboard/SKILL.md
      status: active
      aliases: [onboard, brownfield, hidratar, adoptar, seed, proyecto existente]
      activated_by: orchestra-director
    deploy:
      process: deploy
      lead: deploy-lead
      skill: .cursor/skills/deploy/SKILL.md
      status: active
      aliases: [deploy, release, publicar, main, push a main, vercel]
      activated_by: orchestra-director

leads:
  # Todos los Leads pueden lanzar expertos como subagentes en paralelo
  subagents:
    guide: .cursor/skills/_shared/lead-subagents.md
    graph: .cursor/skills/_shared/graph.md
    critic: .cursor/skills/_shared/critic.md
    lessons: .cursor/skills/_shared/lessons.md
    prefer: parallel_when_independent
    report_to: lead_only
    orchestra_visibility: none
  discovery-lead:
    process: discovery
    skill: .cursor/skills/discovery/SKILL.md
    state: memory/processes/discovery/state.json
    inbox: memory/processes/discovery/inbox-from-orchestra.json
    outbox: memory/processes/discovery/outbox-to-orchestra.json
    internal_agents: [interviewer, user-scout, inventory-scout, critic, scribe]
  bug-lead:
    process: bug
    skill: .cursor/skills/bug/SKILL.md
    state: memory/processes/bug/state.json
    inbox: memory/processes/bug/inbox-from-orchestra.json
    outbox: memory/processes/bug/outbox-to-orchestra.json
    internal_agents: [triager, repro-scout, critic, scribe]
  design-lead:
    process: design
    skill: .cursor/skills/design/SKILL.md
    state: memory/processes/design/state.json
    inbox: memory/processes/design/inbox-from-orchestra.json
    outbox: memory/processes/design/outbox-to-orchestra.json
    internal_agents: [surveyor, architect, ui-designer, critic, scribe]
    reads: [memory/architecture, memory/blueprints]
    writes: [memory/designs, memory/architecture]
  build-lead:
    process: build
    skill: .cursor/skills/build/SKILL.md
    standards: .cursor/skills/build/standards.md
    state: memory/processes/build/state.json
    inbox: memory/processes/build/inbox-from-orchestra.json
    outbox: memory/processes/build/outbox-to-orchestra.json
    internal_agents: [surveyor, planner, tdd-dev, coverage-gate, complexity-gate, sast, mutation, e2e, integrator, critic, scribe]
    reads: [memory/designs, memory/blueprints, memory/architecture]
    writes: [memory/builds]
    quality_gates:
      coverage_min: 85
      mutation_score_min: 70
      cyclomatic_max: 10
      tdd: required
      sast: required_blocking_findings_fail
      e2e: playwright_gherkin_required_or_skip
      parallelize: maximize
  onboard-lead:
    process: onboard
    skill: .cursor/skills/onboard/SKILL.md
    state: memory/processes/onboard/state.json
    inbox: memory/processes/onboard/inbox-from-orchestra.json
    outbox: memory/processes/onboard/outbox-to-orchestra.json
    internal_agents: [code-surveyor, capability-scout, docs-scout, synthesizer, critic, scribe]
    reads: [code, docs]
    writes: [memory/architecture, memory/blueprints, memory/backlog, memory/onboard]
  deploy-lead:
    process: deploy
    skill: .cursor/skills/deploy/SKILL.md
    git: .cursor/skills/deploy/git.md
    vercel: .cursor/skills/deploy/vercel.md
    state: memory/processes/deploy/state.json
    inbox: memory/processes/deploy/inbox-from-orchestra.json
    outbox: memory/processes/deploy/outbox-to-orchestra.json
    internal_agents: [surveyor, committer, publisher, gate, critic, scribe]
    reads: [memory/builds, product repos, home git]
    writes: [product repos main, vercel production, home git main, memory/deploys]
    contract: git_main_then_vercel_prod

memory:
  root: memory
  backlog: memory/backlog.json
  blueprints: memory/blueprints
  bugs: memory/bugs
  designs: memory/designs
  builds: memory/builds
  onboard: memory/onboard
  deploys: memory/deploys
  lessons: memory/lessons
  costs: memory/costs
  architecture: memory/architecture
  landscape: memory/architecture/landscape.md
  adrs: memory/architecture/adrs
  director_state: memory/director-state.json
  processes: memory/processes
  rule: |
    director-state: solo Orquesta.
    processes/*/state: solo el Lead.
    architecture/: Design Lead (y Onboard seed / humano).
    designs/: Design Lead → input de Build.
    onboard/: Onboard Lead (informe de seed).
    deploys/: Deploy Lead (git main + vercel --prod; home versiona memory/).
    lessons/: Lead que bloquea por calidad aguas arriba. La Orquesta no edita.
    costs/: hook Cursor (stop); la Orquesta solo lee.

# Nubes de la organización (Design debe respetar)
org:
  clouds:
    allowed: [vercel, gcp]
    policy: |
      Vercel y GCP están permitidas con su suite completa.
      Elegir servicios por necesidad (no repartir front→Vercel / back→GCP).
      Se puede usar una, la otra, o ambas.
      Otra nube requiere ADR Accepted de excepción.
  architecture:
    default_style: hexagonal
    default_deployable: modular_monolith
    microservices: only_when_absolutely_necessary
    policy: |
      Arquitectura hexagonal (domain / application / ports / adapters) en cada artefacto.
      Preferir monolito modular con capas claras.
      Microservicios solo si es absolutamente necesario, con ADR Accepted.
      Ver .cursor/skills/design/architecture-principles.md
  design_system:
    default: null
    resolve_order: [landscape, project_yaml, product_code, ask_user]
    examples:
      - shadcn/ui
      - "@mui/material"
      - "@infosails/design-system"
      - custom
      - none
    policy: |
      El harness no impone kit UI. El producto elige (shadcn, MUI, InfoSails,
      custom, ninguno, u otro).
      Resolver: landscape → harness.project.yaml → código existente → preguntar.
      Documentar en landscape. Cambiar de kit a mitad de producto = ADR.
      El ui-designer lee la spec del kit elegido (CSF, Storybook, docs);
      no inventa catálogo ni asume @infosails/design-system.
      Ver .cursor/skills/design/ui-designer.md

lifecycle:
  phases:
    - id: director
      name: Director de Orquesta
      status: active
      role: entrypoint
    - id: discovery
      name: Discovery
      status: active
      output: memory/blueprints/
      next: design
    - id: bug
      name: Bug
      status: active
      output: memory/bugs/
      next: build
    - id: design
      name: Design
      status: active
      input: [memory/blueprints/, memory/architecture/]
      output: memory/designs/
      next: build
    - id: build
      name: Build
      status: active
      input: memory/designs/
      output: [code, memory/builds/]
      next: deploy
      quality_gates:
        coverage_min: 85
        mutation_score_min: 70
        cyclomatic_max: 10
        tdd: true
        sast: required_blocking_findings_fail
        e2e: playwright_gherkin_required_or_skip
    - id: onboard
      name: Onboard
      status: active
      input: [code, docs]
      output: [memory/architecture/, memory/blueprints/, memory/onboard/]
      next: null
    - id: deploy
      name: Deploy
      status: active
      input: [memory/builds/, product repos, home git]
      output: [product repos main, vercel production, home git main, memory/deploys/]
      next: null

paths:
  project_template: templates/project
  blueprint_template: templates/feature-blueprint.md
  design_package_template: templates/design-package.md
  adr_template: templates/adr.md
  onboard_report_template: templates/onboard-report.md
  deploy_report_template: templates/deploy-report.md
  schema: schemas/feature-blueprint.schema.json
  design_schema: schemas/design-package.schema.json
  director_state_schema: schemas/director-state.schema.json
  backlog_schema: schemas/backlog.schema.json
  costs_ledger_schema: schemas/costs-ledger.schema.json
  deploy_report_schema: schemas/deploy-report.schema.json
  lesson_template: templates/lesson.md
  lesson_schema: schemas/lesson.schema.json
  process_lead_state_schema: schemas/process-lead-state.schema.json
  subagent_report_schema: schemas/subagent-report.schema.json

blueprint:
  format: markdown
  companion: json
  id_pattern: "BP-{YYYYMMDD}-{SEQ:03d}"
  default_status: "Ready for Build"
  discovery_agent_name: "Discovery Lead"
  onboard_status: "Done"
  onboard_agent_name: "Onboard Lead"

design_package:
  format: markdown
  companion: json
  id_pattern: "DS-{YYYYMMDD}-{SEQ:03d}"
  default_status: "Ready for Build"
  design_agent_name: "Design Lead"

adr:
  id_pattern: "ADR-{YYYYMMDD}-{SEQ:03d}"
  path: memory/architecture/adrs

bug_brief:
  format: markdown
  companion: json
  id_pattern: "BUG-{YYYYMMDD}-{SEQ:03d}"
  default_status: "Ready for Fix"
  bug_agent_name: "Bug Lead"

onboard_report:
  format: markdown
  id_pattern: "ONBOARD-{YYYYMMDD}-{SEQ:03d}"
  path: memory/onboard
  onboard_agent_name: "Onboard Lead"

deploy_report:
  format: markdown
  companion: json
  id_pattern: "DR-{YYYYMMDD}-{SEQ:03d}"
  default_status: "Live"
  path: memory/deploys
  deploy_agent_name: "Deploy Lead"
  target_branch: main
  contract: |
    Commit y push a main en repos de producto y en el home (memory/).
    Después vercel --prod --yes en cada app Vercel. El home no se publica.

lesson:
  format: markdown
  companion: json
  id_pattern: "LSN-{YYYYMMDD}-{SEQ:03d}"
  path: memory/lessons

agents:
  director:
    skill: .cursor/skills/director/SKILL.md
    role: orchestra
    speaks_to: leads_only
  discovery-lead:
    skill: .cursor/skills/discovery/SKILL.md
    role: process_lead
    process: discovery
    reports_to: director
  bug-lead:
    skill: .cursor/skills/bug/SKILL.md
    role: process_lead
    process: bug
    reports_to: director
  design-lead:
    skill: .cursor/skills/design/SKILL.md
    role: process_lead
    process: design
    reports_to: director
    output_dir: memory/designs
  build-lead:
    skill: .cursor/skills/build/SKILL.md
    role: process_lead
    process: build
    reports_to: director
    output_dir: memory/builds
    standards: .cursor/skills/build/standards.md
  onboard-lead:
    skill: .cursor/skills/onboard/SKILL.md
    role: process_lead
    process: onboard
    reports_to: director
    output_dir: memory/onboard
  deploy-lead:
    skill: .cursor/skills/deploy/SKILL.md
    role: process_lead
    process: deploy
    reports_to: director
    output_dir: memory/deploys
