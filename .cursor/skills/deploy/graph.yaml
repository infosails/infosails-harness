# Template DAG — Deploy.
# Primero se elige dev+prod o solo prod. Dev (sin --prod) solo si eligieron ambos.
# Prod (tag semver, luego --prod) solo con autorización humana.
# surveyor instancía committer:<repo_id>, publisher:dev:<app_id>,
# tagger:<repo_id> y publisher:prod:<app_id>.
# Ver _shared/graph.md. Home siempre después de scribe.

process: deploy
nodes:
  - id: surveyor
    role: surveyor
    kind: serial
    writes: []
  - id: choose:targets
    role: chooser
    kind: human
    optional: true
    writes: []
  - id: gate:git
    role: gate
    kind: gate
    writes: []
  - id: gate:vercel:dev
    role: gate
    kind: gate
    optional: true
    writes: []
  - id: approve:prod
    role: approver
    kind: human
    optional: true
    writes: []
  - id: gate:tag
    role: gate
    kind: gate
    optional: true
    writes: []
  - id: gate:vercel:prod
    role: gate
    kind: gate
    optional: true
    writes: []
  - id: critic
    role: critic
    kind: gate
    writes: []
  - id: scribe
    role: scribe
    kind: serial
    writes:
      - memory/deploys/
      - memory/backlog.json
  - id: committer:home
    role: committer
    kind: serial
    writes:
      - .
  - id: gate:home
    role: gate
    kind: gate
    writes: []
edges:
  - { from: surveyor, to: choose:targets }
  - { from: choose:targets, to: gate:git }
  - { from: gate:git, to: gate:vercel:dev }
  - { from: gate:vercel:dev, to: approve:prod }
  - { from: approve:prod, to: gate:tag }
  - { from: gate:tag, to: gate:vercel:prod }
  - { from: gate:vercel:prod, to: critic }
  - { from: critic, to: scribe }
  - { from: scribe, to: committer:home }
  - { from: committer:home, to: gate:home }
